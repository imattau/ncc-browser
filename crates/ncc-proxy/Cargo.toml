[package]
name = "ncc-proxy"
description = "Loopback NCC proxy: resolves locators and serves them over localhost virtual hosts"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ncc-proxy"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
futures-util = "0.3.34"
ncc-core = { path = "../ncc-core" }
ncc-identity = { path = "../ncc-identity" }
nostr = "0.44.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2"
webpki-roots = "1.0.12"
x509-parser = "0.18.1"

[lints.rust]
unsafe_code = "forbid"
