[package]
name = "ncc-identity"
description = "Encrypted local identity and NIP-07 signing for Nostr Navigator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = "0.5"
base64 = "0.23.1"
chacha20poly1305 = "0.10"
bitcoin = "0.32"
nostr = { version = "0.44.8", features = ["nip04", "nip44"] }
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[features]
# Compiles the Android JNI bridge on a host without an NDK:
#   cargo check -p ncc-identity --features android-bridge
# Android enables it by target, not by feature.
android-bridge = ["dep:jni"]

[lints.rust]
# Denied rather than forbidden: the Android keystore envelope needs two pointer
# conversions into JNI handles, which is the only `unsafe` in the crate and is
# allowed at that one function.
unsafe_code = "deny"

# The Android keystore envelope talks to a Kotlin helper through JNI. `ndk-context`
# is deliberately absent: Tauri never initialises it, and its accessor panics.
[dependencies.jni]
version = "0.21"
optional = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
