name: Android

# Deliberately separate from `release.yml` until the Android build is a supported
# artifact: a desktop release tag must not be able to fail on an unfinished mobile
# job. Once M3 lands, fold this into `release.yml` so one tag ships every platform.
on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this build to Zapstore
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 27.2.12479018
  # Rust and Gradle both need to agree on this.
  RUST_TARGET: aarch64-linux-android

jobs:
  android:
    name: Android (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ env.RUST_TARGET }}

      - name: Android SDK
        run: scripts/android-sdk.sh

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - run: npm ci

      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: npm version "${GITHUB_REF_NAME#android-v}" --no-git-tag-version --allow-same-version

      - name: Derive versionName and versionCode
        run: node scripts/android-version.mjs

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ ! -d src-tauri/gen/android ]; then
            echo "src-tauri/gen/android is missing; run 'npx tauri android init' and commit it (M0)" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # `tauri android init` reads this file for the release signing config.
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties
          chmod 600 src-tauri/gen/android/keystore.properties

      # `beforeBuildCommand` in tauri.conf.json builds the chrome bundle.
      - name: Build APK
        env:
          # aws-lc-sys needs the NDK to cross-compile its C for Android.
          ANDROID_NDK_HOME: ${{ env.NDK_HOME }}
        run: npx tauri android build --apk --split-per-abi

      - name: Stage the APK for Zapstore
        run: |
          set -euo pipefail
          APK_DIR=src-tauri/gen/android/app/build/outputs/apk
          APK=$(find "$APK_DIR" -name '*.apk' | grep -i 'arm64' | head -1 || true)
          if [ -z "$APK" ]; then
            APK=$(find "$APK_DIR" -name '*.apk' | grep -i 'universal' | head -1 || true)
          fi
          if [ -z "$APK" ]; then
            echo "no APK produced under $APK_DIR" >&2
            find "$APK_DIR" -maxdepth 3 -type d >&2 || true
            exit 1
          fi
          mkdir -p release/android
          cp "$APK" release/android/ncc-browser-android-arm64.apk
          (cd release/android && sha256sum ncc-browser-android-arm64.apk > SHA256SUMS.txt)
          cat release/android/SHA256SUMS.txt

      - name: Verify the APK is signed and carries arm64
        run: |
          set -euo pipefail
          APK=release/android/ncc-browser-android-arm64.apk
          unzip -l "$APK" > "$RUNNER_TEMP/entries.txt"
          grep -q 'lib/arm64-v8a/' "$RUNNER_TEMP/entries.txt" || {
            echo 'APK has no arm64-v8a payload' >&2
            exit 1
          }
          APKSIGNER=$(find "${ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: ncc-browser-android
          path: release/android/
          if-no-files-found: error

      - name: Attach to a GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" release/android/ncc-browser-android-arm64.apk release/android/SHA256SUMS.txt --clobber

      # `zsp publish` never reads the keystore: it signs the listing and release with
      # SIGN_WITH, and the catalog relay checks that certificate against the claim
      # created once by hand. Until that claim exists, publishing stays off:
      #
      #   gh variable set ZAPSTORE_PUBLISH --repo imattau/ncc-browser --body true
      #
      # Run `zsp check` first when this fails.
      - name: Publish to Zapstore
        if: inputs.publish || vars.ZAPSTORE_PUBLISH == 'true'
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_NSEC }}
        run: |
          go install github.com/zapstore/zsp/v2/cmd/zsp@v2.0.1
          "$(go env GOPATH)/bin/zsp" publish
