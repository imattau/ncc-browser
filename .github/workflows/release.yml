name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NPACK_VERSION: 0.10.1
  NDK_VERSION: 27.2.12479018
  RUST_TARGET: aarch64-linux-android

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  linux:
    name: Linux (deb, rpm, flatpak, npk)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-linux-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-linux-

      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci

      - uses: actions/cache@v6
        with:
          path: resources/tor
          key: tor-linux-${{ hashFiles('scripts/tor-version.json', 'scripts/fetch-tor.mjs') }}
          restore-keys: tor-linux-

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm flatpak flatpak-builder

      - name: Install Flatpak runtimes
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          # Pulls org.freedesktop.Platform//26.08 as a dependency.
          flatpak install --user -y --noninteractive flathub \
            org.electronjs.Electron2.BaseApp//26.08

      - name: Build deb, rpm and flatpak
        run: npm run dist:linux

      - name: Package signed nccsearch update assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NCCSEARCH_UPDATE_SIGNING_KEY_PEM: ${{ secrets.NCCSEARCH_UPDATE_SIGNING_KEY_PEM }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/package-nccsearch-update.mjs

      - name: Verify bundled Tor
        run: |
          TOR_DIR=release/linux-unpacked/resources/tor/tor
          LD_LIBRARY_PATH="$TOR_DIR" "$TOR_DIR/tor" --version

      - name: Get the npack CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${NPACK_VERSION}" --repo imattau/npack \
            --pattern "npack_${NPACK_VERSION}_amd64.deb" --dir npack-deb
          dpkg-deb -x npack-deb/*.deb npack-root
          sudo install -m 0755 npack-root/usr/bin/npack /usr/local/bin/npack
          npack --version

      # The same unpacked build as an npack package (https://github.com/imattau/npack):
      # a deterministic .npk plus its manifest. It is published to Nostr by the
      # `npack` job, once the GitHub release holds the asset.
      - name: Pack the .npk
        env:
          PUBLISHER: ${{ vars.NOSTR_PUBLISHER }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            test -n "$PUBLISHER" || { echo "::error::set the repository variable NOSTR_PUBLISHER"; exit 1; }
          else
            PUBLISHER="${PUBLISHER:-manual-test-publisher}"
          fi
          VERSION="$(node -p "require('./package.json').version")"
          scripts/pack-npk.sh "$VERSION" "$PUBLISHER" release

      - name: Install the .npk into a scratch store and check its launcher
        run: |
          npack install release/ncc-browser-*-linux-x86_64.npk --store "$RUNNER_TEMP/store"
          exe=$(find "$RUNNER_TEMP/store" -name ncc-browser -perm -u+x \( -type f -o -type l \) | head -1)
          test -n "$exe" || { find "$RUNNER_TEMP/store"; exit 1; }
          echo "installed $exe"
          # The launcher must identify the app the way Electron does: WM_CLASS
          # and the Wayland app_id are "nostr-navigator" (app.setName), and
          # GNOME/COSMIC match those against the desktop file id and
          # StartupWMClass. A mismatch shows a generic icon for the running app.
          desktop="$RUNNER_TEMP/store/packages/share/applications/nostr-navigator.desktop"
          test -f "$desktop"
          grep -qx 'Icon=ncc-browser' "$desktop"
          grep -qx 'StartupWMClass=nostr-navigator' "$desktop"
          # Also a candidate default browser, not just the ncc:// handler.
          grep -q 'x-scheme-handler/http;' "$desktop"
          grep -q 'x-scheme-handler/https;' "$desktop"
          ! grep -q '{{prefix}}' "$desktop"
          test -f "$RUNNER_TEMP/store/packages/share/icons/hicolor/256x256/apps/ncc-browser.png"
          app_dir="$(dirname "$(readlink -f "$exe")")"
          node - "$app_dir/resources/app.asar" <<'NODE'
          const assert = require('node:assert/strict')
          const asar = require('@electron/asar')
          const files = new Set(asar.listPackage(process.argv[2]).map((file) => file.replace(/^\/+/, '')))
          for (const file of [
            'node_modules/tldts/package.json',
            'node_modules/tldts/dist/cjs/index.js',
            'node_modules/tldts-core/package.json',
            'node_modules/tldts-core/dist/cjs/index.js',
          ]) assert(files.has(file), `missing runtime file in app.asar: ${file}`)
          NODE

      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          if-no-files-found: error
          path: |
            release/*.deb
            release/*.rpm
            release/*.flatpak
            release/*.npk
            release/*.manifest.json
            release/nccsearch-file-*
            release/nccsearch-manifest.json

  macos:
    name: macOS (dmg, zip)
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-macos-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-macos-

      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci

      - uses: actions/cache@v6
        with:
          path: resources/tor
          key: tor-macos-${{ hashFiles('scripts/tor-version.json', 'scripts/fetch-tor.mjs') }}
          restore-keys: tor-macos-

      - name: Build dmg and zip (x64 + arm64)
        run: npm run dist:mac

      - uses: actions/upload-artifact@v7
        with:
          name: macos-packages
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip

  windows:
    name: Windows (NSIS)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-windows-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-windows-

      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci

      - uses: actions/cache@v6
        with:
          path: resources/tor
          key: tor-windows-${{ hashFiles('scripts/tor-version.json', 'scripts/fetch-tor.mjs') }}
          restore-keys: tor-windows-

      - name: Build NSIS installer
        run: npm run dist:win

      - uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          if-no-files-found: error
          path: release/*.exe

  android:
    name: Android (arm64)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ env.RUST_TARGET }}
      - name: Android SDK
        run: scripts/android-sdk.sh
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Derive versionName and versionCode
        run: node scripts/android-version.mjs
      - run: npm ci
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties
          chmod 600 src-tauri/gen/android/keystore.properties
      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ env.NDK_HOME }}
        run: npx tauri android build --apk --split-per-abi
      - name: Stage and verify APK
        run: |
          set -euo pipefail
          APK_DIR=src-tauri/gen/android/app/build/outputs/apk
          APK=$(find "$APK_DIR" -name '*.apk' | grep -i 'arm64' | head -1 || true)
          if [ -z "$APK" ]; then
            APK=$(find "$APK_DIR" -name '*.apk' | grep -i 'universal' | head -1 || true)
          fi
          test -n "$APK" || { echo "no APK produced under $APK_DIR" >&2; exit 1; }
          mkdir -p release/android
          cp "$APK" release/android/ncc-browser-android-arm64.apk
          (cd release/android && sha256sum ncc-browser-android-arm64.apk > SHA256SUMS.txt)
          unzip -l release/android/ncc-browser-android-arm64.apk > "$RUNNER_TEMP/entries.txt"
          grep -q 'lib/arm64-v8a/' "$RUNNER_TEMP/entries.txt"
          APKSIGNER=$(find "${ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort | tail -1)
          "$APKSIGNER" verify --print-certs release/android/ncc-browser-android-arm64.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android-packages
          path: release/android/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [linux, macos, windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          name: Nostr Navigator ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: artifacts/*

  zapstore:
    name: Publish Android build to Zapstore
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: android-packages
          path: release/android

      - name: Install Zapstore CLI
        run: |
          installed=""
          for attempt in 1 2 3; do
            if go install github.com/zapstore/zsp/v2/cmd/zsp@v2.0.1; then
              installed=1
              break
            fi
            echo "go install failed (attempt $attempt), retrying" >&2
            sleep $((attempt * 10))
          done
          [ -n "$installed" ] || { echo "zsp could not be installed after 3 attempts" >&2; exit 1; }

      - name: Validate and publish to Zapstore
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_NSEC }}
        run: |
          set -euo pipefail
          test -n "$SIGN_WITH" || { echo "::error::set the repository secret ZAPSTORE_NSEC"; exit 1; }
          "$(go env GOPATH)/bin/zsp" check
          "$(go env GOPATH)/bin/zsp" publish

  npack:
    name: Publish to Nostr (npack)
    needs: release
    # Signs the release under the publisher key, so it only runs for a version tag
    # and only once the NOSTR_SECRET_KEY secret and NOSTR_PUBLISHER variable exist.
    if: startsWith(github.ref, 'refs/tags/v') && vars.NOSTR_PUBLISHER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: pkg

      - name: Get the npack CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${NPACK_VERSION}" --repo imattau/npack \
            --pattern "npack_${NPACK_VERSION}_amd64.deb" --dir npack-deb
          dpkg-deb -x npack-deb/*.deb npack-root
          sudo install -m 0755 npack-root/usr/bin/npack /usr/local/bin/npack
          npack --version

      - name: Publish the release events
        env:
          NOSTR_SECRET_KEY: ${{ secrets.NOSTR_SECRET_KEY }}
          NOSTR_RELAYS: ${{ vars.NOSTR_RELAYS }}
        run: |
          test -n "$NOSTR_SECRET_KEY" || { echo "::error::set the repository secret NOSTR_SECRET_KEY"; exit 1; }
          : "${NOSTR_RELAYS:=wss://relay.ditto.pub
          wss://nostr-01.yakihonne.com
          wss://relay.primal.net}"
          args=()
          while IFS= read -r r; do [[ -n "${r//[[:space:]]/}" ]] && args+=(--relay "$r"); done <<< "$NOSTR_RELAYS"
          manifest=$(ls pkg/ncc-browser-*-linux-x86_64.manifest.json)
          npk=$(basename "$manifest" .manifest.json).npk
          npack publish "$manifest" "${args[@]}" \
            --secret-key "$NOSTR_SECRET_KEY" \
            --artifact-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${npk}" \
            --icon-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/build/icons/256x256.png"
