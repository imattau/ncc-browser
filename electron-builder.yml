appId: io.github.imattau.nccbrowser
productName: Nostr Navigator
executableName: ncc-browser
copyright: Copyright © 2026 imattau

directories:
  output: release
  buildResources: build

# The main and renderer bundles are self-contained except for runtime dependencies
# that Electron must resolve from app.asar.
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!node_modules/**/*'
  - node_modules/adblock-rs/package.json
  - node_modules/adblock-rs/js/index.js
  - node_modules/adblock-rs/js/index.node
  - node_modules/tldts/**/*
  - node_modules/tldts-core/**/*

extraResources:
  - from: resources/nccsearch
    to: nccsearch
  - from: resources/site-publisher
    to: site-publisher

asar: true
asarUnpack:
  - node_modules/adblock-rs/**/*.node
compression: normal
npmRebuild: false
removePackageScripts: true

mac:
  category: public.app-category.utilities
  icon: build/icon.png
  protocols:
    - name: Web browser
      schemes: [http, https]
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # Ad-hoc signing keeps the arm64 app launchable without an Apple Developer ID.
  # Replace with a real identity (and notarize) for a signed public release.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  # extraResources live under Contents/Resources; sign the bundled Mach-O files
  # explicitly so ad-hoc signing covers the Tor executable and its dylib.
  extraResources:
    - from: resources/tor/mac-${arch}
      to: tor
  binaries:
    - Contents/Resources/tor/tor/tor
    - Contents/Resources/tor/tor/libevent-2.1.7.dylib

dmg:
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  title: ${productName} ${version}

win:
  icon: build/icon.png
  extraResources:
    - from: resources/tor/win-${arch}
      to: tor
  artifactName: ${name}-${version}-win-${arch}-setup.${ext}
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Nostr Navigator
  artifactName: ${name}-${version}-win-${arch}-setup.${ext}

linux:
  # A directory gives flatpak every size it accepts; a single 1024px icon is
  # skipped there because flatpak refuses icons above 512px.
  icon: build/icons
  extraResources:
    - from: resources/tor/linux-${arch}
      to: tor
  category: Network;WebBrowser
  synopsis: Browse Nostr identity services without DNS
  description: >-
    Nostr Navigator resolves ncc://<npub>/<service> through NCC-05 locators and
    renders the service bound to that Nostr identity.
  maintainer: imattau
  vendor: imattau
  syncDesktopName: true
  mimeTypes:
    - x-scheme-handler/ncc
    - x-scheme-handler/http
    - x-scheme-handler/https
    - text/html
    - application/xhtml+xml
  artifactName: ${name}-${version}-linux-${arch}.${ext}
  target:
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
    - target: flatpak
      arch: [x64]

flatpak:
  runtime: org.freedesktop.Platform
  runtimeVersion: '26.08'
  sdk: org.freedesktop.Sdk
  base: org.electronjs.Electron2.BaseApp
  baseVersion: '26.08'
  useWaylandFlags: true
  finishArgs:
    - --socket=wayland
    - --socket=x11
    - --share=ipc
    - --share=network
    - --device=dri
    - --socket=pulseaudio
    - --filesystem=xdg-download
    - --talk-name=org.freedesktop.Notifications
    - --talk-name=org.kde.StatusNotifierWatcher
