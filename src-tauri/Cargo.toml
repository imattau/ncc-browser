[package]
name = "ncc-navigator"
description = "Nostr Navigator shell for Android"
version = "0.47.16"
authors = ["imattau"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

# Excluded from the root workspace (see ../Cargo.toml): a Tauri desktop dependency
# tree would drag WebKitGTK into `cargo test -p ncc-core` on Linux.
[lib]
name = "ncc_navigator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "2.2.0"
sha2 = "0.10"
jni = "0.21.1"
# rustls-platform-verifier (pulled in transitively by reqwest's "rustls" feature) needs
# its own Android init call before first use, and its own jni version — see
# init_platform_verifier() in lib.rs.
jni-for-verifier = { package = "jni", version = "=0.22.4" }
rustls-platform-verifier = "0.7.1"
ndk-context = "0.1"
ncc-core = { path = "../crates/ncc-core" }
ncc-identity = { path = "../crates/ncc-identity" }
ncc-proxy = { path = "../crates/ncc-proxy" }
ncc-tor = { path = "../crates/ncc-tor", features = ["bundled"] }
ncc-vault = { path = "../crates/ncc-vault" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nostr = "0.44.8"
futures-util = "0.3"
log = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "socks"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["net", "rt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
psl = "2.1.255"

[dev-dependencies]
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["net", "rt", "macros", "time"] }
